<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pursuits — Growth Cockpit</title>
<style>
  :root{
    --es-purple:#43224d; --es-red:#e0044e; --es-gray:#4c4c4d;
    --bg:#fafafa; --panel:#fff; --panel-2:#f5f5f6;
    --ink:#1c1a1f; --body:#45424a; --muted:#7a7681; --faint:#a6a2ad;
    --line:#e8e6ea; --line-2:#f0eef2;
    --accent:var(--es-purple);
    --green:#1f8a4c; --amber:#b9791a; --red:#c4083f; --blue:#3265aa;
    --radius:10px; --shadow:0 1px 2px rgba(20,15,25,.05);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}

  .side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
  .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
  .brand h1{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.2px}
  .brand span{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
  .sec-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 6px 8px;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav a{color:var(--body);text-decoration:none;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-left:2px solid transparent}
  .nav a:hover{background:var(--panel-2)}
  .nav a.active{background:var(--panel-2);color:var(--accent);font-weight:600;border-left-color:var(--accent);border-radius:0 8px 8px 0}
  .nav .badge{font-size:10px;background:#faf3e5;color:var(--amber);border-radius:12px;padding:1px 7px;font-weight:700}
  .side-foot{margin-top:auto;font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:14px;line-height:1.6}

  .main{overflow:auto}
  .masthead{position:sticky;top:0;z-index:20;background:rgba(250,250,250,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 30px;display:flex;justify-content:space-between;align-items:center}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink)}
  .crumb .lnk{cursor:pointer;color:var(--accent)}
  .mh-right{display:flex;align-items:center;gap:12px;position:relative}
  .lens{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 6px;cursor:pointer;font-size:12.5px}
  .lens .li{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
  .lens b{color:var(--ink);font-weight:600}
  .lens .caret{color:var(--faint);font-size:10px}
  .lens-menu{position:absolute;top:42px;right:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 28px rgba(20,15,25,.12);padding:6px;width:240px;display:none;z-index:30}
  .lens-menu.open{display:block}
  .lens-menu .lm-h{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
  .lens-menu button{width:100%;text-align:left;background:none;border:none;font:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--body)}
  .lens-menu button:hover{background:var(--panel-2)}
  .lens-menu button b{color:var(--ink);font-weight:600;display:block}
  .lens-menu button small{color:var(--muted);font-size:11px}
  .tag{font-size:9px;padding:2px 7px;border-radius:20px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
  .tag.on{background:#eaf5ee;color:var(--green);border-color:transparent}

  .content{padding:24px 30px;max-width:1240px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:16px;flex-wrap:wrap}
  .topbar h2{font-size:21px;font-weight:700;color:var(--ink)}
  .topbar p{color:var(--muted);font-size:13px;margin-top:3px;max-width:720px}
  .geo{display:flex;gap:6px}
  .geo button{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 13px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .geo button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .kpi .n{font-size:24px;font-weight:800;color:var(--ink);margin-top:5px}
  .kpi .d{font-size:11.5px;margin-top:3px;color:var(--muted)}
  .statline{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;margin-bottom:16px;font-size:12.5px;box-shadow:var(--shadow);flex-wrap:wrap}
  .statline .seg{display:flex;align-items:center;gap:6px}
  .statline .sw{width:9px;height:9px;border-radius:3px}
  .statline b{color:var(--ink)}
  .statline .why{margin-left:auto;color:var(--faint);font-size:11.5px}

  .cols{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .ch{padding:14px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card .ch .sub{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:11px}
  .card .cb{padding:16px}

  .banner{border:1px solid #f0e3c8;background:#fdf8ec;border-radius:var(--radius);padding:13px 16px;font-size:13px;color:#7a5c17;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
  .banner b{color:#5f470f}
  .banner .whylink{margin-left:auto;white-space:nowrap}

  .dev{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
  .dev:last-child{border-bottom:none}
  .dev .dt{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;padding-top:2px;width:52px}
  .dev .dk{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .dev .dk.lead{background:var(--accent)} .dev .dk.tech{background:var(--blue)} .dev .dk.fin{background:var(--green)} .dev .dk.risk{background:var(--red)}
  .dev .db{flex:1}
  .dev .db b{color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
  .dev .db b:hover{color:var(--accent)}
  .dev .db p{font-size:12.5px;color:var(--body);margin-top:1px}
  .dev .act{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--accent);background:#f6f2f8;border:1px solid #e9e0ee;border-radius:14px;padding:3px 10px;cursor:pointer}
  .dev .act:hover{background:#efe7f3}
  .dev .dismiss{margin-top:6px;margin-left:6px;display:inline-flex;font-size:11.5px;color:var(--faint);border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;background:var(--panel)}
  .dev .dismiss:hover{color:var(--body);background:var(--panel-2)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--body)}
  tr:last-child td{border-bottom:none}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--panel-2)}
  .co b{font-weight:600;color:var(--ink);display:block}
  .co small{color:var(--faint);font-size:11px}
  .score-cell{display:flex;align-items:center;gap:9px}
  .bar{height:5px;width:52px;background:var(--line-2);border-radius:3px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:3px}
  .b-score{font-weight:700;color:var(--ink);font-family:var(--mono);font-size:12.5px}
  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .pill.accept{background:#eaf5ee;color:var(--green)}
  .pill.build{background:#eaf0fa;color:var(--blue)}
  .pill.review{background:#faf3e5;color:var(--amber)}
  .pill.reject{background:#fbeaef;color:var(--red)}
  .pill.setup{background:var(--panel-2);color:var(--muted)}
  .pill .pd{width:5px;height:5px;border-radius:50%;background:currentColor}
  .val{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:12.5px}
  .mat{font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.03em}
  .mat.high{background:#fbeaef;color:var(--red)}
  .mat.med{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}

  .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .filters button{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 13px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .back{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;font-weight:600;margin-bottom:12px;display:inline-flex;gap:6px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 20px;flex-wrap:wrap}
  .tabs button{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:10px 13px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
  .tabs button:hover{color:var(--ink)}
  .tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
  .tabs button:disabled{opacity:.45;cursor:not-allowed}
  .tabs .num{font-size:10px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:1px 6px;margin-right:6px}
  .tabs button.active .num{background:var(--accent);color:#fff;border-color:var(--accent)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .block h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .block h3 .sub{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:11px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px;gap:14px}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--muted)} .kv b{color:var(--ink);font-weight:600;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--body)}
  .chip.sig{background:#eef5fb;border-color:#d7e7f4;color:#2c6395}
  .chip.rel-strong{background:#eaf5ee;border-color:#cfe7d8;color:var(--green)}
  .chip.rel-warm{background:#faf3e5;border-color:#eee0bd;color:var(--amber)}
  .chip.rel-cold{background:var(--panel-2);color:var(--muted)}

  .matrix{width:100%;border-collapse:collapse;font-size:12.5px}
  .matrix th{padding:9px 8px;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted)}
  .matrix td{padding:8px;border-bottom:1px solid var(--line-2);text-align:center}
  .matrix .kit{padding:11px 12px;font-weight:600;color:var(--ink);text-align:left}
  .matrix .kit small{display:block;color:var(--faint);font-weight:400;font-size:11px;margin-top:1px}
  .mcell{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-weight:700;color:var(--ink);font-size:12.5px}
  .mcell i{display:block;width:30px;height:3px;border-radius:2px}
  .rowscore{font-weight:800;font-family:var(--mono);text-align:right !important}
  .whylink{font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:600}
  .evid{background:var(--panel-2);border-left:3px solid var(--line);padding:10px 14px;font-size:12px;color:var(--body);margin-top:4px;border-radius:0 8px 8px 0}
  .evid b{color:var(--ink)}
  .motion{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .motion.cross{background:#f2edf6;color:var(--accent)}
  .motion.new{background:#eef5fb;color:var(--blue)}

  .gate-wrap{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}
  .verdict{border-radius:var(--radius);padding:20px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--panel)}
  .verdict .vh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .verdict .big{font-size:25px;font-weight:800}
  .verdict .sc{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:7px}
  .verdict .sc b{color:var(--ink)}
  .verdict p{color:var(--body);margin-top:11px;font-size:13px;line-height:1.6}
  .verdict p b{color:var(--ink)}
  .impact{margin-top:12px;padding:10px 13px;background:var(--panel-2);border-radius:8px;font-size:12px;color:var(--body)}
  .impact b{color:var(--ink);font-family:var(--mono)}
  .axis{margin:13px 0}
  .axis .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .axis .top b{font-weight:600;color:var(--ink)}
  .axis .top .v{font-family:var(--mono);color:var(--muted);font-size:11px}
  .axis .track{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}
  .axis .track>i{display:block;height:100%;border-radius:4px;background:var(--es-gray);transition:width .25s}
  .weights label{font-size:12px;color:var(--muted);margin:12px 0 4px;display:flex;justify-content:space-between}
  .weights label .wv{font-family:var(--mono);color:var(--ink);font-weight:700}
  input[type=range]{width:100%;accent-color:var(--es-gray);cursor:pointer}
  .rtw input[type=range]{accent-color:var(--accent)}
  .thresh{margin-top:8px;padding-top:13px;border-top:1px solid var(--line)}
  .reset{margin-top:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font:inherit;font-size:12px;color:var(--body);cursor:pointer}
  .reset:hover{background:var(--line-2)}
  .btn{background:var(--accent);border:none;border-radius:8px;padding:9px 16px;font:inherit;font-size:13px;font-weight:600;color:#fff;cursor:pointer}
  .btn:hover{opacity:.92}
  .hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6}
  .hint b{color:var(--body)}
  .disq .d{display:flex;gap:9px;font-size:12.5px;color:var(--red);padding:8px 0;border-top:1px dashed #f0d4dc}
  .disq .d:first-child{border-top:none}

  .persona{border:1px solid var(--line);border-radius:10px;padding:15px;background:var(--panel)}
  .persona .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .persona .av{width:34px;height:34px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:12px}
  .persona .pr{font-weight:700;color:var(--ink);font-size:13px}
  .persona .rel{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);display:inline-block;margin-top:2px}
  .persona .rel.champ{color:var(--green);background:#eaf5ee;border-color:transparent}
  .persona .rel.gate{color:var(--amber);background:#faf3e5;border-color:transparent}
  .persona .lab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:10px 0 2px;font-weight:700}
  .persona p{font-size:12.5px;color:var(--body);line-height:1.5}

  .camp{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--panel);overflow:hidden}
  .camp .chd{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .camp .ct{font-weight:700;color:var(--ink);font-size:13.5px}
  .camp .cmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .camp .cgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-2)}
  .camp .cg{padding:11px 16px;border-right:1px solid var(--line-2)}
  .camp .cg:last-child{border-right:none}
  .camp .cg .lab{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin-bottom:2px}
  .camp .cg p{font-size:12px;color:var(--body);line-height:1.45}
  .camp .hook{padding:11px 16px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--body);font-style:italic;background:var(--panel-2)}
  .tl-item{padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--body)}
  .tl-item:last-child{border-bottom:none}
  .tl-item b{color:var(--ink);display:block;margin-bottom:2px}
  .tl-item small{color:var(--muted);font-size:11.5px}

  .meth{max-width:880px}
  .meth .step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
  .meth .step:last-child{border-bottom:none}
  .meth .sn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
  .meth .step b{color:var(--ink);display:block;margin-bottom:2px}
  .meth .step p{font-size:12.5px}
  .rubric td:first-child{font-weight:600;color:var(--ink)}
  .rubric td{font-size:12.5px;vertical-align:top}
  .formula{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;color:var(--ink);margin:10px 0;line-height:1.7}
  .gov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
  .gov li{font-size:12.5px;margin:0 0 8px 16px;color:var(--body)}
  .gov li b{color:var(--ink)}

  /* Setup */
  .setup-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .setup-row:hover{background:var(--panel-2)}
  .setup-row:last-child{border-bottom:none}
  .setup-row .st{margin-left:auto;display:flex;align-items:center;gap:10px}
  .prog{width:90px;height:6px;background:var(--line-2);border-radius:4px;overflow:hidden}
  .prog>i{display:block;height:100%;border-radius:4px;background:var(--green)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .field textarea{resize:vertical;min-height:64px}
  .quad{display:block;margin:6px auto}
  .muted{color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--faint);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">P</div><div><h1>Pursuits</h1><span>Growth Cockpit</span></div></div>
    <div><div class="sec-label">Workspace</div><nav class="nav" id="nav"></nav></div>
    <div><div class="sec-label">Trust</div><nav class="nav" id="nav2"></nav></div>
    <div class="side-foot">Vision preview · sample data<br>Fit is the agents&#39; view. Right to Win is yours.</div>
  </aside>
  <main class="main">

/* ============ SCORING ============ */
function kitScore(s){const w=WEIGHTS,t=w.problem+w.value+w.ready+w.constr+w.signal;return Math.round((s.problem*w.problem+s.value*w.value+s.ready*w.ready+s.constr*w.constr+s.signal*w.signal)/t);}
function bestMatch(a){return a.matches.map(m=>({...m,score:kitScore(m.s)})).sort((x,y)=>y.score-x.score)[0];}
function hasHardDisq(a){const h=/sponsor|incumbent|budget|freeze|funding|vendor/i;return a.matches.some(m=>m.disq.some(d=>h.test(d)));}
function rtwScore(a){const r=a.rtw;return Math.round((r.rel+r.cred+r.del+r.comp+r.comm)/5*20);}
function verdict(a){
 if(!a.setup.complete)return{v:"setup",top:null,rtw:null};
 const top=bestMatch(a),hard=hasHardDisq(a),rtw=rtwScore(a);
 if(hard&&top.score<THRESHOLD.accept)return{v:"reject",top,hard,rtw};
 if(top.score>=THRESHOLD.accept&&!hard)return rtw>=THRESHOLD.rtw?{v:"accept",top,hard,rtw}:{v:"build",top,hard,rtw};
 if(top.score>=THRESHOLD.review)return{v:"review",top,hard,rtw};
 return{v:"reject",top,hard,rtw};}

const VCOLOR={accept:"var(--green)",build:"var(--blue)",review:"var(--amber)",reject:"var(--red)",setup:"var(--muted)"};
function bandColor(n){return n>=THRESHOLD.accept?"var(--green)":n>=THRESHOLD.review?"var(--amber)":"var(--faint)";}
function motionOf(a){return a.setup.play==="active"||a.setup.play==="past"?"cross":"new";}
function explain(a,v){const k=v.top?KITS[v.top.kit].name:"";
 if(v.v==="accept")return `Recommend <b>pursue</b>. ${k} clears the fit bar (${THRESHOLD.accept}) with no hard disqualifier, and your right-to-win (${v.rtw}) clears the ${THRESHOLD.rtw} bar. Fit says the problem is real; your RTW says the win is realistic.`;
 if(v.v==="build")return `<b>Strong fit, weak hand.</b> ${k} clears the fit bar, but your right-to-win (${v.rtw}) is below ${THRESHOLD.rtw}. Recommend <b>building the right to win before committing a pursuit slot</b>: warm an entry relationship, line up a reference, or partner to cover the gap — then re-assess. Chasing now converts a good opportunity into a likely loss.`;
 if(v.v==="review")return `Recommend <b>human review</b>. ${k} lands in the qualified band (${THRESHOLD.review}–${THRESHOLD.accept})${v.hard?" and a hard disqualifier is flagged":""}. RTW ${v.rtw}. The weak axes are what to pressure-test before spending a slot.`;
 return `Recommend <b>pass</b>. ${v.hard?`A hard disqualifier (sponsor / budget / incumbent / vendor) blocks the pursuit regardless of fit.`:`Best fit ${k} scores ${v.top.score}, below the review bar (${THRESHOLD.review}).`} Finite effort goes further elsewhere.`;}

let baseCounts=null;
function quadSvg(fit,rtw){
 const x=40+(fit/100)*200, y=170-(rtw/100)*140;
 const tx=40+(THRESHOLD.accept/100)*200, ty=170-(THRESHOLD.rtw/100)*140;
 return `<svg class="quad" width="270" height="200" viewBox="0 0 270 200">
  <rect x="40" y="30" width="200" height="140" fill="none" stroke="#e8e6ea"/>
  <line x1="${tx}" y1="30" x2="${tx}" y2="170" stroke="#d8d5dc" stroke-dasharray="4 3"/>
  <line x1="40" y1="${ty}" x2="240" y2="${ty}" stroke="#d8d5dc" stroke-dasharray="4 3"/>
  <text x="${(tx+240)/2}" y="${(30+ty)/2}" text-anchor="middle" font-size="10" fill="#1f8a4c" font-weight="700">PURSUE</text>
  <text x="${(tx+240)/2}" y="${(ty+170)/2+4}" text-anchor="middle" font-size="10" fill="#3265aa" font-weight="700">BUILD RTW</text>
  <text x="${(40+tx)/2}" y="${(30+ty)/2}" text-anchor="middle" font-size="10" fill="#b9791a" font-weight="700">NURTURE</text>
  <text x="${(40+tx)/2}" y="${(ty+170)/2+4}" text-anchor="middle" font-size="10" fill="#a6a2ad" font-weight="700">PASS</text>
  <circle cx="${x}" cy="${y}" r="7" fill="#43224d"/>
  <circle cx="${x}" cy="${y}" r="11" fill="none" stroke="#43224d" stroke-opacity=".3"/>
  <text x="140" y="192" text-anchor="middle" font-size="10.5" fill="#7a7681">Fit (agents) →</text>
  <text x="18" y="100" text-anchor="middle" font-size="10.5" fill="#7a7681" transform="rotate(-90 18 100)">Right to Win (you) →</text>
 </svg>`;}
function renderGate(){
 const a=state.acct,body=document.getElementById("tabbody");
 baseCounts=gateCounts();
 body.innerHTML=`<div class="gate-wrap">
  <div>
   <div class="verdict" id="vBox"></div>
   <div class="block" style="margin-top:14px"><h3>Fit score contribution by axis <span class="sub">agents&#39; side of the decision</span></h3><div id="axisBars"></div></div>
   <div class="block" style="margin-top:14px" id="disqBox"></div>
  </div>
  <div>
   <div class="block rtw"><h3>Right to Win — your assessment <span class="sub">agents never set these</span></h3>
    <div id="rtwSliders">${RTW_DIMS.map(d=>`
     <label style="font-size:12px;color:var(--muted);margin:12px 0 2px;display:flex;justify-content:space-between">${d.label} <span class="wv" style="font-family:var(--mono);color:var(--ink);font-weight:700" id="r-${d.key}">${a.rtw[d.key]}/5</span></label>
     <div style="font-size:11px;color:var(--faint);margin-bottom:4px">${d.q}</div>
     <input type="range" min="1" max="5" value="${a.rtw[d.key]}" oninput="setRtw('${d.key}',this.value)">`).join("")}</div>
    <div id="quadBox" style="margin-top:10px"></div>
   </div>
   <div class="block weights" style="margin-top:14px"><h3>Gate parameters <span class="sub">portfolio-wide</span></h3>
    <div id="sliders">${AXES.map(x=>`<label>${x.label} <span class="wv" id="w-${x.key}">${WEIGHTS[x.key]}</span></label><input type="range" min="0" max="50" value="${WEIGHTS[x.key]}" oninput="setW('${x.key}',this.value)">`).join("")}</div>
    <div class="thresh">
     <label>Fit bar (accept) <span class="wv" id="thAcceptV">${THRESHOLD.accept}</span></label><input type="range" min="50" max="90" value="${THRESHOLD.accept}" oninput="setThresh('accept',this.value)">
     <label>Review bar <span class="wv" id="thReviewV">${THRESHOLD.review}</span></label><input type="range" min="40" max="80" value="${THRESHOLD.review}" oninput="setThresh('review',this.value)">
     <label>Right-to-win bar <span class="wv" id="thRtwV">${THRESHOLD.rtw}</span></label><input type="range" min="40" max="80" value="${THRESHOLD.rtw}" oninput="setThresh('rtw',this.value)">
    </div>
    <button class="reset" onclick="resetGate()">Reset to defaults</button>
   </div>
  </div></div>`;
 refreshGate();
}
function refreshGate(){
 const a=state.acct,v=verdict(a),top=v.top;
 const box=document.getElementById("vBox");if(!box)return;
 box.innerHTML=`<div class="vh"><span class="big" style="color:${VCOLOR[v.v]}">${VLABEL[v.v]}</span>
  <span class="pill ${v.v}"><span class="pd"></span>fit ${top.score}/${THRESHOLD.accept} · rtw ${v.rtw}/${THRESHOLD.rtw}</span></div>
  <div class="sc">best fit: <b>${KITS[top.kit].name}</b> · motion: ${motionOf(a)==="cross"?"cross-sell":"new account"}</div>
  <p>${explain(a,v)}</p>
  <div class="impact" id="impact"></div>`;
 const w=WEIGHTS,t=w.problem+w.value+w.ready+w.constr+w.signal;
 document.getElementById("axisBars").innerHTML=AXES.map(x=>{const c=Math.round(top.s[x.key]*w[x.key]/t);
  return `<div class="axis"><div class="top"><b>${x.label}</b><span class="v">${top.s[x.key]} × ${w[x.key]} → +${c}</span></div><div class="track"><i style="width:${top.s[x.key]}%"></i></div></div>`;}).join("");
 const allDisq=[...new Set(a.matches.flatMap(m=>m.disq))];
 document.getElementById("disqBox").innerHTML=allDisq.length
  ?`<h3 style="color:var(--red)">Disqualifiers flagged <span class="sub">override the score — by design</span></h3><div class="disq">${allDisq.map(d=>`<div class="d">⚠ ${d}</div>`).join("")}</div>`
  :`<h3 style="color:var(--green)">No disqualifiers <span class="sub">no hard blocks against any matched kit</span></h3>`;
 document.getElementById("quadBox").innerHTML=quadSvg(top.score,v.rtw);
 const now=gateCounts();
 const delta=k=>{const d=now[k]-baseCounts[k];return d===0?"":` (${d>0?"+":""}${d})`;};
 document.getElementById("impact").innerHTML=`<b>Portfolio impact:</b> Pursue ${now.accept}${delta("accept")} · Build RTW ${now.build}${delta("build")} · Review ${now.review}${delta("review")} · Pass ${now.reject}${delta("reject")} <span class="muted">— across all active accounts</span>`;
 const hp=document.getElementById("hdrPill");if(hp){hp.className="pill "+v.v;hp.innerHTML=`<span class="pd"></span>${VLABEL[v.v]} · fit ${top.score} · rtw ${v.rtw}`;}
}
function setRtw(k,val){state.acct.rtw[k]=+val;const el=document.getElementById("r-"+k);if(el)el.textContent=val+"/5";refreshGate();}
function setW(k,val){WEIGHTS[k]=+val;const el=document.getElementById("w-"+k);if(el)el.textContent=val;refreshGate();}
function setThresh(k,val){THRESHOLD[k]=+val;const map={accept:"thAcceptV",review:"thReviewV",rtw:"thRtwV"};const el=document.getElementById(map[k]);if(el)el.textContent=val;refreshGate();}
function resetGate(){WEIGHTS={...DEFAULT_W};THRESHOLD={...DEFAULT_T};renderGate();toast("Gate parameters reset to defaults (v1.0). RTW inputs are yours and were not touched.");}

/* ---- TARGETING ---- */

/* ============ METHODOLOGY ============ */
function renderMethodology(){
 setCrumb('<b>Methodology</b>');
 content.innerHTML=`<div class="meth">
  <div class="topbar"><div><h2>Methodology</h2><p>Where every number comes from — and which numbers the machine is not allowed to produce.</p></div></div>
  <div class="block" style="margin-bottom:14px"><h3>The pipeline</h3>
   <div class="step"><span class="sn">0</span><div><b>Account setup — human first</b><p>Before anything is scored you supply the inside knowledge agents cannot find: existing play, delivered work, relationships and their strength, incumbents, lost bids, politics. Accounts without completed setup are <b>not scored</b>. This is the bottom-up guarantee: the engine starts from your truth, not the internet&#39;s.</p></div></div>
   <div class="step"><span class="sn">1</span><div><b>Sense — watcher agents</b><p>Per-account agents track external developments (news, filings, hiring, leadership, regulation) continuously. Each event is dated, typed, sourced.</p></div></div>
   <div class="step"><span class="sn">2</span><div><b>Interpret & materiality</b><p>GenAI tags events to the canonical taxonomy and classifies materiality. Only high-materiality events become triggers; the rest wait in a weekly digest. Your dismissals retrain the bar — the alert-fatigue defense, formalized.</p></div></div>
   <div class="step"><span class="sn">3</span><div><b>Fit-mapping — five axes</b><p>Each (account × kit) pair scores 0–100 per axis with recorded evidence. For existing clients the cross-sell miner also checks whitespace and kit adjacency.</p></div></div>
   <div class="step"><span class="sn">4</span><div><b>Right to Win — yours alone</b><p>Five dimensions (relationships, credentials, delivery, competitive, commercial) scored 1–5 <b>by you</b>. Agents never set or adjust these. Fit asks &ldquo;is the opportunity real?&rdquo;; RTW asks &ldquo;can we win it?&rdquo; — different questions, different owners.</p></div></div>
   <div class="step"><span class="sn">5</span><div><b>Gate — fit × RTW × disqualifiers</b><p>Four outcomes: <b>Pursue</b> (both bars cleared), <b>Build RTW</b> (fit real, hand weak — do groundwork, don&#39;t chase), <b>Review</b> (borderline fit — human call), <b>Pass</b>. Disqualifiers override everything.</p></div></div>
   <div class="step"><span class="sn">6</span><div><b>Act & learn</b><p>Trigger-born campaigns, critic-reviewed, human-approved, contact-governed. Outcomes feed recalibration quarterly.</p></div></div>
  </div>
  <div class="block" style="margin-bottom:14px"><h3>Fit axes — agent-scored</h3>
   <table class="rubric"><thead><tr><th>Axis</th><th>Question it answers</th><th>Primary inputs</th></tr></thead><tbody>
    <tr><td>Problem fit</td><td>Do their tagged problems overlap this kit&#39;s tags?</td><td>Taxonomy overlap and centrality</td></tr>
    <tr><td>Value lever</td><td>Does the kit&#39;s value mechanism match what they must move?</td><td>Mandates, earnings pressure, regulation</td></tr>
    <tr><td>Readiness</td><td>Could they buy and absorb this within 2 quarters?</td><td>Sponsor, team maturity, prerequisites</td></tr>
    <tr><td>Constraints fit</td><td>Do budget, stack, vendors, procurement allow it?</td><td>Budget cycle, incumbents, procurement</td></tr>
    <tr><td>Signal strength</td><td>How strong and recent is external evidence of intent?</td><td>Count, recency, independence of developments</td></tr>
   </tbody></table></div>
  <div class="block" style="margin-bottom:14px"><h3>Right-to-Win dimensions — user-scored, never by agents</h3>
   <table class="rubric"><thead><tr><th>Dimension</th><th>Question you answer (1–5)</th></tr></thead><tbody>
    ${RTW_DIMS.map(d=>`<tr><td>${d.label}</td><td>${d.q}</td></tr>`).join("")}
   </tbody></table>
   <p class="hint">Why human-only: these depend on knowledge that is private (your bench, your pricing), relational (who trusts you) and political (what really happened last time). An agent estimating them would manufacture false confidence at the exact point the decision needs honesty.</p></div>
  <div class="block" style="margin-bottom:14px"><h3>The formula</h3>
   <div class="formula">fit(account, kit) = Σ(axis × weight) / Σweights &nbsp;&nbsp;[agents]<br>rtw(account) = mean(5 dims) × 20 &nbsp;&nbsp;[you]<br>gate: fit ≥ ${DEFAULT_T.accept} ∧ rtw ≥ ${DEFAULT_T.rtw} → Pursue · fit ≥ ${DEFAULT_T.accept} ∧ rtw &lt; ${DEFAULT_T.rtw} → Build RTW<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;fit ${DEFAULT_T.review}–${DEFAULT_T.accept} → Review · else Pass · hard disqualifier overrides all</div>
   <p class="hint">Weights and bars are portfolio-wide and versioned; axis scores in this preview are hand-set sample data following the rubric.</p></div>
  <div class="block"><h3>Alert discipline — the fatigue defense</h3>
   <p style="font-size:13px">Four mechanisms, because a trigger feed that cries wolf is worse than none: <b>materiality classification</b> (only high-materiality events interrupt; medium waits for the weekly digest), a <b>trigger budget</b> (max ${TRIGGER_BUDGET} surfaced per week — forced prioritization), <b>expiry</b> (triggers lapse with their window instead of accumulating), and <b>dismiss-to-tune</b> (your dismissals raise the bar for that signal type). Silence is the default; signal is the exception.</p></div>
 </div>`;
}

/* ============ GOVERNANCE ============ */
function renderGovernance(){
 setCrumb('<b>Governance & Data</b>');
 content.innerHTML=`
  <div class="topbar"><div><h2>Governance & Data</h2><p>The rules the engine runs under — built into the product, not a PDF beside it.</p></div></div>
  <div class="gov-grid gov">
   <div class="block"><h3>Architecture</h3><ul>
    <li><b>Human-first bottom-up.</b> No account is scored without user-provided inside knowledge; agent intelligence layers on top of it, never instead of it.</li>
    <li><b>One engine, three lenses.</b> Growth Lead, Presales, BA are configuration over the same store, registry and pipeline.</li>
    <li><b>Versioned everything.</b> Kit registry, gate weights and thresholds are versioned; every decision records what it was computed against.</li>
    <li><b>Graceful degradation.</b> Failed enrichment marks evidence stale rather than silently scoring on old data.</li>
   </ul></div>
   <div class="block"><h3>Data policy</h3><ul>
    <li><b>Allowlisted sources.</b> Public filings, press, careers pages, licensed providers. No scraping behind logins, no personal social accounts.</li>
    <li><b>Business-role data only.</b> Roles and business context, no sensitive personal data — GDPR/DPDP legitimate-interest basis.</li>
    <li><b>Provenance mandatory.</b> Unsourced claims cannot enter scoring. User-provided inside knowledge is labeled as such and never presented as agent findings.</li>
    <li><b>Retention & residency.</b> Evidence expires (default 12 months) unless refreshed; residency follows the deploying org.</li>
   </ul></div>
   <div class="block"><h3>Model governance</h3><ul>
    <li><b>RTW is human-only.</b> Agents may not set, adjust or average the right-to-win inputs. The system fails loudly if RTW is missing rather than guessing.</li>
    <li><b>Weights versioned & logged.</b> Parameter changes create a new version with author and timestamp.</li>
    <li><b>Humans own verdicts.</b> Overrides are logged with reasons and feed recalibration.</li>
    <li><b>Nothing auto-sends.</b> All outreach and content is draft-until-approved; the contact governor caps concurrent campaigns per account.</li>
   </ul></div>
  </div>
  <div class="card"><div class="ch">Decision audit trail <span class="sub">sample — immutable log</span></div>

    <tr><td class="val" style="font-weight:400">Jul 22 14:03</td><td>Meridian Logistics</td><td><span class="pill accept"><span class="pd"></span>Pursue</span></td><td>fit 82 · rtw 72 (user) · kit TEC-1 v3</td><td>gate-agent</td></tr>
    <tr><td class="val" style="font-weight:400">Jul 22 11:37</td><td>Corepoint Health</td><td><span class="tag">rtw updated</span></td><td>relationships 4→5: "COO renewed sponsorship"</td><td>J. Okafor</td></tr>
    <tr><td class="val" style="font-weight:400">Jul 21 09:41</td><td>Northwind Retail</td><td><span class="pill review"><span class="pd"></span>Override → Review</span></td><td>rep: "CEO statement worth one meeting" · logged</td><td>M. Fischer</td></tr>
    <tr><td class="val" style="font-weight:400">Jul 20 17:12</td><td>—</td><td><span class="tag">weights v1.0</span></td><td>initial gate parameters approved</td><td>L. Fulara</td></tr>
   </tbody></table></div>`;
}

renderNav();render();
</script>
